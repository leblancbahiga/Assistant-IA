name: Code Quality

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy isort flake8
      
      - name: Run Black (formatter)
        run: black src/ tests/ --check --diff
      
      - name: Run isort (imports)
        run: isort src/ tests/ --check-only --diff
      
      - name: Run flake8 (linter)
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503
      
      - name: Run mypy (type checker)
        run: mypy src/ --ignore-missing-imports --no-implicit-optional
        continue-on-error: true
