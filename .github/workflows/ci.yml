name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check --diff src/ tests/ scripts/

      - name: Check import order (isort)
        run: isort --check-only --diff src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (dev only — mlx est macOS-only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (mlx mockés via sys.modules, sauf test_memory.py)
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_memory.py \
            -v --tb=short \
            -W ignore::pytest.PytestUnraisableExceptionWarning \
            -W ignore::DeprecationWarning

      - name: Run memory tests (allow failure — besoin GPU/embeddings réels)
        continue-on-error: true
        run: |
          python -m pytest tests/test_memory.py \
            -v --tb=short \
            -W ignore::DeprecationWarning \
            -k "not slow" || echo "⚠️ memory tests skipped: mlx/GPU non disponible sur CI"
