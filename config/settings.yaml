cache_maxsize: 256
cache_ttl_seconds: 300
cloud_fallback: openrouter/deepseek/deepseek-v4-flash
cloud_model: llama-3.3-70b-versatile
cloud_provider: groq
heavy_search_min_ram_mb: 1000
hybrid_enabled: true
hybrid_mode: cloud_first
learning_enabled: true
local_model: mlx-community/Phi-4-mini-instruct-4bit
local_model_fallback: mlx-community/Phi-4-mini-instruct-4bit
nuru_brain_enabled: true
nuru_brain_watch_enabled: false
rag_k: 5
rag_max_context_tokens: 2000
rag_score_fallback: 0.25
rag_score_threshold: 0.3
ram_critical_threshold_gb: 0.5
ram_warning_threshold_gb: 1.0
rerank_min_ram_mb: 800
response_mode: hybrid
session_window: 5
stt_model: small
token_juice_enabled: true
token_juice_max_chunk_chars: 2000
tts_enabled: true
tts_engine: piper
