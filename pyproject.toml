[project]
name = "nuru"
version = "10.3.0"
description = "NURU V10.3 — Assistant IA local pour Apple Silicon (Phi-4-mini / Groq / RAG multi-stratégie sécurisé)"
authors = [
    { name = "Leblanc BAHIGA Mudarhi" }
]
dependencies = [
    "mlx-lm",
    "mlx-whisper",
    "mlx-embeddings",
    "sqlite-vec",
    "pysqlite3-binary",
    "pyside6",
    "qasync",
    "psutil",
    "httpx",
    "numpy",
    "pymupdf",
    "python-docx",
    "loguru",
    "sentence-transformers",
    "sounddevice",
    "soundfile",
    "watchdog",
    "pyyaml",
    "pydantic-settings",
    "keyring",
    "cachetools",
    "pytesseract",
    "pdf2image",
]

[project.optional-dependencies]
ocr = ["pytesseract", "pdf2image"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
