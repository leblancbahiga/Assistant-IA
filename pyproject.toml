[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuru-v12"
version = "0.15.0"
description = "NURU V15 - Personal Cognitive Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "leblancbahiga", email = "leblancbahiga@github.com"}
]
dependencies = [
    "cachetools>=7.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "keyring>=24.0.0",
    "rank-bm25>=0.1.14",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
cloud = [
    "groq>=0.7.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
]
voice = [
    "mlx-whisper>=0.1.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.5",
]
vision = [
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
]
ui = [
    "PySide6>=6.5.0",
]
ml = [
    "mlx>=0.0.14",
    "mlx-lm>=0.18.0",
    "transformers>=4.40.0",
]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(\n  _archive\n  | _tools\n  | _references\n  | .idea\n  | .hermes\n)/\n'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --tb=short --no-header --ignore=tests/test_eval_lora_adapter.py --ignore=tests/test_kv_compress.py --deselect=tests/test_zai_architecture.py::TestZaiTokens::test_color_tokens --deselect=tests/test_zai_architecture.py::TestZaiTokens::test_radius_tokens --deselect=tests/test_zai_architecture.py::TestZaiTokens::test_window_sizes --deselect=tests/test_zai_architecture.py::TestZaiNuruWindow::test_window_dimensions --deselect=tests/test_memory.py::test_semantic_memory --deselect=tests/test_memory.py::test_memory_retrieval --deselect=tests/test_memory.py::test_session_max_messages --deselect=tests/test_agent.py::TestPlanPhase::test_plan_with_rag_and_memory --deselect=tests/test_router.py::TestDocumentPatterns::test_pattern_identity_query_lowercase --deselect=tests/test_router.py::TestLlmClassification::test_llm_classification --deselect=tests/test_router.py::TestLlmClassification::test_llm_classification_offline --deselect=tests/test_router.py::TestLlmClassification::test_llm_classification_no_llm --deselect=tests/test_router.py::TestFallback::test_cloud_fallback --deselect=tests/test_router.py::TestFallback::test_clarification_offline --deselect=tests/test_router.py::TestRouteWithContext::test_route_with_context_ram_escalation --deselect=tests/test_orchestrator_pipeline.py::test_cache_hit_retour_immediat --deselect=tests/test_orchestrator_pipeline.py::test_cache_miss_pipeline_normal --deselect=tests/test_orchestrator_pipeline.py::test_llm_error_recuperation --deselect=tests/test_orchestrator_pipeline.py::test_generation_complete_event --deselect=tests/test_orchestrator_pipeline.py::test_query_tracke_dans_memoire --deselect=tests/test_orchestrator_pipeline.py::test_pipeline_offline --deselect=tests/test_integration_s8.py::TestShellToFilePipeline::test_shell_write_append_read --deselect=tests/test_naming_collisions.py::test_no_class_name_collisions --deselect=tests/test_v11_factchecker_citations.py::test_markdown_with_citations"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
    "asyncio: async tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
target_percentage = 80
precision = 2
